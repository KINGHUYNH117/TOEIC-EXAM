version: '3'

services:

  abp_host:
    image: abp/mvc
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ConnectionStrings__Default: "${TOEIC_DB_CONNECTION_STRING:?Set TOEIC_DB_CONNECTION_STRING}"
      Authentication__JwtBearer__SecurityKey: "${TOEIC_JWT_SECURITY_KEY:?Set TOEIC_JWT_SECURITY_KEY}"
      TZ: "America/Toronto"
      Kestrel__Endpoints__Http__Url: "http://+:80"
    ports:
      - "44312:80"
    volumes:
      - "./Mvc-Logs:/app/App_Data/Logs"
    restart: always
